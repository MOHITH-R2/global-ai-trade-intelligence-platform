services:
  backend:
    build: .
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: ${APP_MODE:-demo}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8502}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8502,http://localhost:8502}
      AISSTREAM_ALLOW_INSECURE_SSL: ${AISSTREAM_ALLOW_INSECURE_SSL:-false}
    volumes:
      - ./.runtime:/app/.runtime
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: .
    command: python -m streamlit run frontend/app.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE: http://backend:8001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8502}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
